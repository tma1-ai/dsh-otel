# The @tma1-ai/dsh-plugin-greptimedb bundle patch: one row, addressable by its id.
#
# A profile patch replaces the targeted row's whole `config` rather than merging
# into it, so a user override must restate every field it keeps — including
# `endpoint`, which has no default.
#
# `!!js` values are plain YAML scalars evaluated by the Loader. They must not
# start with a backtick: YAML reserves that character as an indicator, so a
# template literal here fails to parse before the tag is ever applied.

- insert:
    - id: greptimedb-otel
      name: '@tma1-ai/dsh-plugin-greptimedb'
      config:
        endpoint: !!js process.env.GREPTIMEDB_OTLP_ENDPOINT ?? 'http://localhost:4000/v1/otlp'
        database: !!js process.env.GREPTIMEDB_DATABASE ?? 'public'
        username: !!js process.env.GREPTIMEDB_USERNAME ?? ''
        password: !!js process.env.GREPTIMEDB_PASSWORD ?? ''
        logTable: dsh_logs
        # Structure and token accounting only. Raise to `full` to include
        # conversation and tool payloads; see the README before doing so.
        content: none
